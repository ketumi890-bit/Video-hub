<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1022"><title>VIRAL VIDEO HUB · Admin</title>
<style>
:root{--bg:#0b1022;--panel:#151d39;--muted:#aab4d3;--text:#f7f8ff;--a:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#25245a 0,transparent 35%),var(--bg);color:var(--text);font:15px system-ui,Arial}
.wrap{max-width:760px;margin:auto;padding:20px 15px 50px}.brand{font-size:21px;font-weight:900;margin:8px 0 20px}.brand span{color:#a995ff}
.panel,.post{background:linear-gradient(160deg,#1b2548,#121a33);border:1px solid #ffffff18;border-radius:18px;padding:18px;margin:14px 0}
h2{margin:0 0 14px}label{display:block;margin:13px 0 6px;color:var(--muted)}
input{width:100%;padding:13px;border-radius:11px;border:1px solid #ffffff25;background:#0c1430;color:white;font:inherit}
button{border:0;border-radius:11px;padding:11px 15px;color:white;font-weight:800;background:linear-gradient(110deg,#7c5cff,#4b9bff);cursor:pointer;margin:8px 5px 0 0}
.danger{background:linear-gradient(110deg,#d83b68,#a92746)}.ghost{background:#ffffff15;border:1px solid #ffffff20}
.wide{width:100%}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.post h3{margin:0 0 8px}.post img{width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin:7px 0}
.status{padding:12px;border-radius:11px;background:#ffffff10;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
a{color:#b8a9ff}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">🎬 VIRAL <span>VIDEO HUB</span> · ADMIN</div>
<section id="loginPanel" class="panel">
<h2>🔐 Admin Login</h2>
<label for="email">Admin Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
<button id="loginBtn" class="wide">Login</button>
<div id="loginStatus" class="status hidden"></div>
<p class="muted">Firebase Console থেকে Email/Password Authentication চালু করে admin user তৈরি করুন।</p>
</section>

<section id="dashboard" class="hidden">
<div class="panel">
<h2 id="formTitle">➕ নতুন ভিডিও পোস্ট</h2>
<label for="postTitle">ভিডিওর Title</label><input id="postTitle" maxlength="120" placeholder="ভিডিওর নাম লিখুন">
<label for="bannerUrl">Banner / Thumbnail URL</label><input id="bannerUrl" type="url" placeholder="https://example.com/banner.jpg">
<label for="videoUrl">Video URL (MP4/WebM অথবা embed URL)</label><input id="videoUrl" type="url" placeholder="https://example.com/video.mp4">
<button id="saveBtn" class="wide">Save Post</button>
<button id="cancelEditBtn" class="wide ghost hidden">Cancel Edit</button>
<div id="formStatus" class="status hidden"></div>
</div>
<div class="panel">
<h2>📚 সব ভিডিও পোস্ট</h2>
<div id="postList"><p class="muted">লোড হচ্ছে…</p></div>
</div>
<button id="logoutBtn" class="ghost">Logout</button>
<a href="./" style="margin-left:10px">Open Website</a>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
 apiKey:"AIzaSyCRc08P690u4R9ctgOKbdYi0EWdtRMAW_4",
 authDomain:"growtaskbdbot.firebaseapp.com",
 databaseURL:"https://growtaskbdbot-default-rtdb.firebaseio.com",
 projectId:"growtaskbdbot",
 storageBucket:"growtaskbdbot.firebasestorage.app",
 messagingSenderId:"529191101847",
 appId:"1:529191101847:web:a4f10e6ae3577171dc90d2",
 measurementId:"G-5E2GQSWJMT"
};
const ADMIN_UID = "zZwst1cELGTdJzkk5Pyk6ukLG123"; // Must match the UID in database.rules.json
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let editingId = null;
let stopPostsListener = null;
const $ = id => document.getElementById(id);

function status(id,message){$(id).textContent=message;$(id).classList.remove("hidden");}
function clearForm(){
 editingId=null;$("postTitle").value="";$("bannerUrl").value="";$("videoUrl").value="";
 $("formTitle").textContent="➕ নতুন ভিডিও পোস্ট";$("saveBtn").textContent="Save Post";
 $("cancelEditBtn").classList.add("hidden");
}
function renderPosts(value){
 const list=$("postList");
 const posts=Object.entries(value||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 if(!posts.length){list.innerHTML='<p class="muted">এখনো কোনো পোস্ট যোগ করা হয়নি।</p>';return;}
 list.innerHTML=posts.map(p=>`<article class="post">
  <h3>${escapeHtml(p.title)}</h3>
  ${p.bannerUrl?`<img src="${escapeHtml(p.bannerUrl)}" alt="" onerror="this.style.display='none'">`:""}
  <p class="muted">ভিডিও: ${escapeHtml(p.videoUrl)}</p>
  <button data-edit="${escapeHtml(p.id)}">Edit</button>
  <button class="danger" data-delete="${escapeHtml(p.id)}">Delete</button>
 </article>`).join("");
 list.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{
   const p=posts.find(x=>x.id===b.dataset.edit);if(!p)return;
   editingId=p.id;$("postTitle").value=p.title||"";$("bannerUrl").value=p.bannerUrl||"";$("videoUrl").value=p.videoUrl||"";
   $("formTitle").textContent="✏️ পোস্ট এডিট";$("saveBtn").textContent="Update Post";$("cancelEditBtn").classList.remove("hidden");
   window.scrollTo({top:0,behavior:"smooth"});
 }));
 list.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",async()=>{
   if(!confirm("এই পোস্টটি ডিলিট করবেন?"))return;
   try{await remove(ref(db,"posts/"+b.dataset.delete));}
   catch(e){alert("Delete failed: "+e.message);}
 }));
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

$("loginBtn").addEventListener("click",async()=>{
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password){status("loginStatus","Email ও Password দিন।");return;}
 $("loginBtn").disabled=true;
 try{await signInWithEmailAndPassword(auth,email,password);}
 catch(e){status("loginStatus","Login failed: "+e.message);}
 finally{$("loginBtn").disabled=false;}
});
$("logoutBtn").addEventListener("click",()=>signOut(auth));
$("cancelEditBtn").addEventListener("click",clearForm);
$("saveBtn").addEventListener("click",async()=>{
 const title=$("postTitle").value.trim(),bannerUrl=$("bannerUrl").value.trim(),videoUrl=$("videoUrl").value.trim();
 if(!title||!videoUrl){status("formStatus","Title এবং Video URL অবশ্যই দিতে হবে।");return;}
 try{
   const payload={title,bannerUrl,videoUrl,updatedAt:Date.now()};
   if(editingId) await update(ref(db,"posts/"+editingId),payload);
   else {const newRef=push(ref(db,"posts"));await set(newRef,{...payload,createdAt:Date.now()});}
   clearForm();status("formStatus","সফলভাবে সংরক্ষণ হয়েছে।");
 }catch(e){status("formStatus","Save failed: "+e.message);}
});
onAuthStateChanged(auth,user=>{
 const allowed=!!user && ADMIN_UID!=="PASTE_ADMIN_USER_UID_HERE" && user.uid===ADMIN_UID;
 $("loginPanel").classList.toggle("hidden",allowed);
 $("dashboard").classList.toggle("hidden",!allowed);
 if(user&&!allowed){signOut(auth);status("loginStatus","এই অ্যাকাউন্টটি Admin UID তালিকায় নেই।");}
 if(allowed){
   if(stopPostsListener)stopPostsListener();
   stopPostsListener=onValue(ref(db,"posts"),snap=>renderPosts(snap.val()),err=>status("formStatus","Database error: "+err.message));
 } else if(stopPostsListener){stopPostsListener();stopPostsListener=null;}
});
</script>
</body>
</html>
